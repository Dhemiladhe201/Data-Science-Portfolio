name: Python and SQL checks

on:
  push:
  pull_request:

jobs:
  check-projects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r projects/fraud-detection-cost-sensitive/requirements.txt
          python -m pip install -r projects/customer-analytics-sql/requirements.txt
      - name: Check fraud evaluation
        run: |
          python -m unittest discover -s projects/fraud-detection-cost-sensitive/tests -v
          python projects/fraud-detection-cost-sensitive/train.py
      - name: Check SQL reporting
        run: |
          python -m unittest discover -s projects/customer-analytics-sql/tests -v
          python projects/customer-analytics-sql/src/run_analysis.py
