name: Python and SQL checks

on:
  push:
  pull_request:

jobs:
  check-projects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r projects/fraud-detection-cost-sensitive/requirements.txt
          python -m pip install -r projects/customer-analytics-sql/requirements.txt
          python -m pip install -r projects/predictive-maintenance/requirements.txt
      - name: Check fraud evaluation
        run: |
          python -m unittest discover -s projects/fraud-detection-cost-sensitive/tests -v
          python projects/fraud-detection-cost-sensitive/train.py
      - name: Check customer analytics
        run: |
          python -m unittest discover -s projects/customer-analytics-sql/tests -v
          python projects/customer-analytics-sql/src/run_analysis.py
      - name: Check dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("projects/customer-analytics-sql/dashboard/index.html").read_text()
          assert html.count("<script>") == 1 and html.count("<script src=") == 1
          code = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/customer_dashboard.js").write_text(code)
          PY
          node --check /tmp/customer_dashboard.js
          node --check projects/customer-analytics-sql/dashboard/sample-results.js
          node - <<'JS'
          global.window = {};
          require("./projects/customer-analytics-sql/dashboard/sample-results.js");
          const d = window.dashboardData;
          if (d.monthly.length !== 30 || d.channels.length !== 4 ||
              d.segments.reduce((n, s) => n + s.count, 0) !== 1000) {
            throw new Error("Unexpected synthetic dashboard data structure");
          }
          JS
      - name: Check predictive maintenance
        run: |
          python -m unittest discover -s projects/predictive-maintenance/tests -v
          python projects/predictive-maintenance/train.py
